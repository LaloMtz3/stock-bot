name: Strategy comparison
# Run by hand from the Actions tab. Replays several versions of the rules on
# ~900 stocks over 5 years and saves the results to comparison.md.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-bot
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python stock_idea_bot.py
        env:
          MODE: compare
      - run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comparison.md comparison.json
          git commit -m "Strategy comparison" || echo "no changes"
          git pull --rebase
          git push
