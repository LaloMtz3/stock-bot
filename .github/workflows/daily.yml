name: Daily stock signals
on:
  schedule:
    - cron: "0 13 * * 1-5"   # 8am Central (7am Nov-Mar), before the 8:30 open
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python stock_idea_bot.py
        env:
          MODE: morning
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
      - run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Daily update" || echo "no changes"
          git pull --rebase
          git push
